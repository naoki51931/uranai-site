name: MoonArcana
options:
  bundleIdPrefix: com.moonarcana
targets:
  MoonArcana:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MoonArcana
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moonarcana.offline
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Moon Arcana
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 手相占いで写真を選択するために使用します。
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
