name: Android APK Build

on:
  push:
    branches:
      - android-offline-openrouter
      - main
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.MOON_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MOON_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOON_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOON_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "::error::Moon Arcana signing secrets are missing"; exit 1; }
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/moon-arcana-release.jks"
          chmod 600 "$RUNNER_TEMP/moon-arcana-release.jks"

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          MOON_KEYSTORE_PATH: ${{ runner.temp }}/moon-arcana-release.jks
          MOON_KEYSTORE_PASSWORD: ${{ secrets.MOON_KEYSTORE_PASSWORD }}
          MOON_KEY_ALIAS: ${{ secrets.MOON_KEY_ALIAS }}
          MOON_KEY_PASSWORD: ${{ secrets.MOON_KEY_PASSWORD }}
        run: gradle -p android --stacktrace assembleRelease

      - name: Build debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: gradle -p android --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk Moon-Arcana-v1.0.0.apk
          else
            cp android/app/build/outputs/apk/release/app-release.apk Moon-Arcana-v1.0.0.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon-arcana-android-v1.0.0
          path: Moon-Arcana-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --target "$GITHUB_SHA" --title "Moon Arcana Android v1.0.0" --notes "Moon Arcana Android版の初回リリースです。タロットカード画像を端末内に収録し、基本占い・履歴保存はオフラインで利用できます。AI詳細解釈のみOpenRouterを使用します。"
          gh release upload v1.0.0 Moon-Arcana-v1.0.0.apk --clobber
