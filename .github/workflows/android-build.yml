name: Android APK Build

on:
  push:
    branches:
      - android-offline-openrouter
      - main
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p android --stacktrace assembleDebug

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Moon-Arcana-v1.0.0.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon-arcana-android-v1.0.0
          path: Moon-Arcana-v1.0.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --target "$GITHUB_SHA" --title "Moon Arcana Android v1.0.0" --notes "Moon Arcana Android版の初回リリースです。タロットカード画像を端末内に収録し、基本占い・履歴保存はオフラインで利用できます。AI詳細解釈のみOpenRouterを使用します。"
          gh release upload v1.0.0 Moon-Arcana-v1.0.0.apk --clobber
